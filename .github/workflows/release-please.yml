name: release-please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Opens or updates the release PR from the Conventional Commits on main, and tags the
      # release when that PR merges. Settings: release-please-config.json.
      - uses: googleapis/release-please-action@v5
